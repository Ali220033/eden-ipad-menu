<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#050403">
    <title>EDEN iPad Menu</title>
    <link rel="preload" as="image" href="assets/eden-opening-clean-4k-hq-ipad.webp" fetchpriority="high">
    <link rel="stylesheet" href="styles.css?v=20260520-smooth2">
  </head>
  <body>
    <main class="ipad-shell" data-screen="opening">
      <section class="opening-screen" aria-label="EDEN opening page">
        <img
          class="opening-art"
          src="assets/eden-opening-clean-4k-hq-ipad.webp"
          srcset="assets/eden-opening-clean-4k-hq-ipad.webp 2048w, assets/eden-opening-clean-4k-hq.webp 4344w"
          sizes="100vw"
          alt="EDEN Restaurant and Lounge opening page"
          width="4344"
          height="5792"
          decoding="async"
          fetchpriority="high"
        >
        <canvas class="spark-canvas" aria-hidden="true"></canvas>
        <div class="lamp-glows" aria-hidden="true">
          <span style="--x: 6.2%; --y: 28.7%; --s: 0.9; --d: -0.2s"></span>
          <span style="--x: 18.5%; --y: 40.2%; --s: 0.62; --d: -1.1s"></span>
          <span style="--x: 28.9%; --y: 49.2%; --s: 0.54; --d: -0.7s"></span>
          <span style="--x: 37.8%; --y: 64.2%; --s: 0.7; --d: -1.8s"></span>
          <span style="--x: 51.9%; --y: 57.4%; --s: 1.05; --d: -0.5s"></span>
          <span style="--x: 63.7%; --y: 64.5%; --s: 0.72; --d: -1.4s"></span>
          <span style="--x: 75.4%; --y: 41.3%; --s: 0.58; --d: -0.9s"></span>
          <span style="--x: 84.7%; --y: 28.9%; --s: 1; --d: -1.6s"></span>
          <span style="--x: 94.1%; --y: 36.3%; --s: 0.74; --d: -0.3s"></span>
        </div>
        <div class="gold-sweep" aria-hidden="true"></div>
        <div class="ambient-glow" aria-hidden="true"></div>
        <button class="enter-area" type="button" data-open-menu data-category="food" aria-label="Enter EDEN menu"></button>
        <nav class="opening-hotspots" aria-label="Open menu sections">
          <button type="button" data-open-menu data-category="food" aria-label="Open food menu"></button>
          <button type="button" data-open-menu data-category="drinks" aria-label="Open drinks"></button>
          <button type="button" data-open-menu data-category="hookah" aria-label="Open hookah"></button>
          <button type="button" data-open-menu data-category="desserts" aria-label="Open desserts"></button>
          <button type="button" data-open-menu data-category="specials" aria-label="Open specials"></button>
        </nav>
      </section>

      <section class="menu-screen" aria-label="EDEN menu">
        <img class="food-page-art" data-menu-art alt="EDEN food menu page" width="4096" height="6144" decoding="async" fetchpriority="high">
        <div class="food-lamp-glows" aria-hidden="true">
          <span style="--x: 4.2%; --y: 55%; --s: 0.9; --d: -0.4s"></span>
          <span style="--x: 22.7%; --y: 36%; --s: 0.62; --d: -1.1s"></span>
          <span style="--x: 31.7%; --y: 49%; --s: 0.58; --d: -0.7s"></span>
          <span style="--x: 70.2%; --y: 14.5%; --s: 0.5; --d: -1.5s"></span>
          <span style="--x: 77%; --y: 19.5%; --s: 0.64; --d: -0.2s"></span>
          <span style="--x: 92%; --y: 52%; --s: 1.05; --d: -1.8s"></span>
        </div>
        <button class="back-hit back-hit-menu" type="button" data-back-menu aria-label="Return to opening page"></button>
        <div class="menu-add-buttons" data-menu-add-buttons aria-label="Add menu items to basket"></div>
        <nav class="food-card-hotspots" aria-label="Food menu categories">
          <button type="button" data-open-section="Main Course" aria-label="Open main course"></button>
          <button type="button" data-open-section="Salads" aria-label="Open salads"></button>
          <button type="button" data-open-section="Sides" aria-label="Open sides"></button>
          <button type="button" data-open-section="Appetizers" aria-label="Open appetizers"></button>
          <button type="button" data-open-section="Burgers" aria-label="Open burgers"></button>
          <button type="button" data-open-section="Shawarma" aria-label="Open shawarma"></button>
        </nav>
      </section>

      <section class="section-screen" aria-label="Food section">
        <img class="section-page-art" data-section-art alt="EDEN menu detail page" decoding="async">
        <div class="section-scroll-stack" data-section-scroll-stack aria-hidden="true"></div>
        <div class="section-veiled-bg" aria-hidden="true"></div>
        <button class="back-hit back-hit-section" type="button" data-back-section aria-label="Return to category page"></button>
        <div class="section-item-hotspots" data-item-hotspots aria-label="Open item details"></div>
        <div class="section-add-buttons" data-add-buttons aria-label="Add items to basket"></div>
        <div class="section-panel" data-section-fallback>
          <p class="eyebrow">EDEN Food Menu</p>
          <h2 data-section-name>Main Course</h2>
          <p>Item page ready for dishes, descriptions, prices, photos, and add-to-order controls.</p>
        </div>
      </section>

      <section class="item-detail-screen" aria-label="Item detail">
        <img class="item-hero-img" data-item-image alt="" decoding="async">
        <div class="item-hero-vignette" aria-hidden="true"></div>
        <button class="item-close-button" type="button" data-close-item aria-label="Close item detail"></button>
        <div class="item-copy">
          <p class="item-kicker" data-item-kicker>EDEN Salads</p>
          <h2 data-item-title>Eden Salad</h2>
          <p class="item-description" data-item-description></p>
          <div class="item-price" data-item-price>$19.00</div>
          <div class="item-options">
            <div class="item-options-title" data-item-options-title>Ingredients</div>
            <div class="item-addons" data-item-addons></div>
          </div>
          <label class="item-instructions">
            <span>Special Instructions</span>
            <textarea data-item-instructions rows="3" placeholder="Allergies, sauce on side, no onions..."></textarea>
          </label>
          <div class="item-actions">
            <div class="item-quantity" aria-label="Quantity">
              <button type="button" data-qty-minus aria-label="Decrease quantity">-</button>
              <span data-item-qty>1</span>
              <button type="button" data-qty-plus aria-label="Increase quantity">&gt;</button>
            </div>
            <button class="item-order-button" type="button" data-add-detail>Add to Order</button>
          </div>
        </div>
        <div class="item-selector" data-item-selector aria-label="Select item"></div>
      </section>

      <section class="quick-order-sheet" data-quick-order aria-label="Order item" hidden>
        <button class="quick-order-backdrop" type="button" data-close-quick-order aria-label="Close order panel"></button>
        <div class="quick-order-card" role="dialog" aria-modal="true" aria-labelledby="quick-order-title">
          <img class="quick-order-image" data-quick-order-image alt="" decoding="async">
          <div class="quick-order-copy">
            <p data-quick-order-kicker>EDEN Menu</p>
            <h2 id="quick-order-title" data-quick-order-name>Item</h2>
            <label class="quick-order-instructions">
              <span>Special Instructions</span>
              <textarea data-quick-order-instructions rows="3" placeholder="Light ice, no sugar, allergies..."></textarea>
            </label>
            <div class="quick-order-row">
              <div class="quick-order-quantity" aria-label="Quantity">
                <button type="button" data-quick-qty-minus aria-label="Decrease quantity">-</button>
                <span data-quick-order-qty>1</span>
                <button type="button" data-quick-qty-plus aria-label="Increase quantity">&gt;</button>
              </div>
              <button class="quick-order-submit" type="button" data-add-quick-order>Add to Order</button>
            </div>
          </div>
        </div>
      </section>

      <aside class="basket-widget" data-basket aria-label="Basket">
        <button class="basket-button" type="button" aria-label="Open basket">
          <span class="basket-mark" aria-hidden="true"></span>
          <span class="basket-text">Basket</span>
          <span class="basket-count" data-basket-count>0</span>
        </button>
        <div class="basket-panel" data-basket-panel>
          <div class="basket-title">Basket</div>
          <p class="basket-empty" data-basket-empty>No items yet</p>
          <ul class="basket-items" data-basket-items></ul>
          <button class="basket-view-order" type="button" data-view-order hidden>View Order</button>
        </div>
      </aside>

      <section class="order-review-screen" data-order-review aria-label="Selected order" hidden>
        <button class="order-review-backdrop" type="button" data-close-order-review aria-label="Close order review"></button>
        <div class="order-review-card" role="dialog" aria-modal="true" aria-labelledby="order-review-title">
          <div class="order-review-header">
            <div>
              <p>EDEN Restaurant & Lounge</p>
              <h2 id="order-review-title">Selected Order</h2>
            </div>
            <button class="order-review-close" type="button" data-close-order-review aria-label="Close order review"></button>
          </div>
          <p class="order-review-empty" data-order-review-empty>No items yet</p>
          <ul class="order-review-items" data-order-review-items></ul>
          <div class="order-review-footer">
            <span data-order-review-total>0 items selected</span>
            <button class="call-waiter-button" type="button" data-call-waiter aria-label="Call waiter">
              <span class="call-waiter-bell" aria-hidden="true"></span>
              <span data-call-waiter-label>Call Waiter</span>
            </button>
            <button type="button" data-close-order-review>Back to Menu</button>
          </div>
        </div>
      </section>

      <div class="page-veil" aria-hidden="true"></div>
    </main>

    <script src="script.js?v=20260520-smooth2"></script>
  </body>
</html>
